name: Build add-on image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64, armv7]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on version
        id: meta
        run: |
          echo "version=$(grep '^version' smartgridready/config.yaml | head -1 | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build add-on image
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/smartgridready \
            --image "chrohrbach/{arch}-ha-smartgridready" \
            --version "${{ steps.meta.outputs.version }}" \
            --docker-hub ghcr.io \
            --addon
