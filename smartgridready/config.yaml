name: SmartGridready
version: "0.2.0"
slug: smartgridready
description: Universal energy-device orchestration via the SmartGridready standard
url: https://github.com/chrohrbach/ha-smartgridready
arch:
  - amd64
  - aarch64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt-circle
panel_title: SmartGridready
hassio_api: true
homeassistant_api: true
host_network: false
boot: auto
startup: services
stage: stable
map:
  - addon_config:rw
  - config:ro
  - share:rw
services:
  - mqtt:need
options:
  config_path: /addon_config/config.yaml
  evaluation_interval: 300
  log_level: info
  mqtt_discovery: true
  mqtt_prefix: smartgridready
  share_path: /share/smartgridready
  timezone: Europe/Zurich
  align_to_quarter: false
  sg_ready_lock_cap_minutes: 120
schema:
  config_path: str
  evaluation_interval: int(60,3600)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  mqtt_discovery: bool
  mqtt_prefix: str
  share_path: str
  timezone: str
  align_to_quarter: bool
  sg_ready_lock_cap_minutes: int(0,1440)
  latitude: "float(-90,90)?"
  longitude: "float(-180,180)?"
