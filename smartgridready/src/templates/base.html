<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SmartGridready{% endblock %}</title>
  <link rel="stylesheet" href="static/style.css">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo.svg" alt="SmartGridready" class="brand-logo">
    </div>
    <nav>
      <a href=".">Overview</a>
      <a href="devices">Devices</a>
      <a href="rules">Rules</a>
      <a href="audit">Audit</a>
      <a href="config">Config</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p>SmartGridready add-on — open-source by
       <a href="https://www.teleia.ch" target="_blank" rel="noopener">teleia</a>
       (engine extracted from
       <a href="https://www.casasmooth.com" target="_blank" rel="noopener">casasmooth</a>).</p>
  </footer>
</body>
</html>
